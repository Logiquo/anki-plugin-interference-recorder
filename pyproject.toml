[project]
name = "anki-plugin-interference-recorder"
version = "0.1.0"
description = "Record interference relationships between Anki cards"
readme = "README.md"
authors = [
    { name = "LogicFan", email = "fanyongda2012@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aqt==26.8.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
